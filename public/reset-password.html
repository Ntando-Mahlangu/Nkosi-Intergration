<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LeadRecovery — Reset Password</title>
<style>
  :root {
    --serif: Georgia, "Iowan Old Style", "Palatino Linotype", "Book Antiqua", serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --bg: #14171f;
    --panel: #1b1e27;
    --border: rgba(201, 168, 117, 0.22);
    --text: #eee7d8;
    --muted: #8b8677;
    --accent: #c9a875;
    --ok: #7fa88a;
    --fail: #b5555a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--sans); background: var(--bg); color: var(--text); }
  #stars { position: fixed; inset: 0; z-index: 0; opacity: 0.35; pointer-events: none; }
  #vignette {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 45%, rgba(12,14,19,0.75) 100%);
  }
  .panel {
    position: relative;
    z-index: 5;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    padding: 28px;
    max-width: 420px;
    margin: 90px auto;
  }
  .panel h1 { font-family: var(--serif); margin-top: 0; font-size: 20px; letter-spacing: 0.01em; font-weight: 400; }
  .tag { font-size: 11px; color: var(--muted); letter-spacing: 0.06em; margin-bottom: 18px; }
  label { display: block; font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--muted); margin: 14px 0 6px; }
  input {
    width: 100%;
    padding: 9px 10px;
    background: rgba(0,0,0,0.4);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-size: 13px;
    font-family: inherit;
  }
  input:focus { outline: none; border-color: var(--accent); }
  button {
    width: 100%;
    margin-top: 18px;
    background: rgba(201,168,117,0.12);
    border: 1px solid var(--text);
    color: var(--text);
    border-radius: 6px;
    padding: 10px 16px;
    font-size: 11px;
    letter-spacing: 0.1em;
    cursor: pointer;
    font-weight: 600;
    font-family: inherit;
    transition: background 0.2s, box-shadow 0.2s;
  }
  button:hover { background: rgba(201,168,117,0.22); border-color: var(--accent); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .error { color: var(--fail); font-size: 13px; margin-top: 12px; }
  .ok { color: var(--ok); font-size: 13px; margin-top: 12px; line-height: 1.5; }
  a.back { display: inline-block; margin-top: 18px; color: var(--muted); font-size: 12px; text-decoration: underline; }
</style>
</head>
<body>

<div id="stars"></div>
<div id="vignette"></div>

<div class="panel" id="request-panel">
  <h1>Forgot your password?</h1>
  <div class="tag">Enter the email your LeadRecovery account uses. If it matches an account, we'll send a link to set a new password.</div>
  <label for="base-url">API base URL</label>
  <input id="base-url" placeholder="http://localhost:3000" />
  <label for="email">Email</label>
  <input id="email" type="email" placeholder="you@business.com" />
  <button id="request-btn">Send Reset Link</button>
  <div class="error" id="request-error" role="alert"></div>
  <div class="ok" id="request-ok" role="status"></div>
  <a class="back" href="index.html">&larr; Back to sign in</a>
</div>

<div class="panel" id="reset-panel" style="display:none;">
  <h1>Set a new password</h1>
  <div class="tag">Choose a new password for your LeadRecovery account.</div>
  <label for="base-url-2">API base URL</label>
  <input id="base-url-2" placeholder="http://localhost:3000" />
  <label for="new-password">New password</label>
  <input id="new-password" type="password" placeholder="At least 8 characters" />
  <label for="confirm-password">Confirm password</label>
  <input id="confirm-password" type="password" placeholder="Repeat the password above" />
  <button id="reset-btn">Set Password</button>
  <div class="error" id="reset-error" role="alert"></div>
  <div class="ok" id="reset-ok" role="status"></div>
</div>

<script>
(function () {
  "use strict";

  (function buildStars() {
    const el = document.getElementById("stars");
    let svg = "<svg width='100%' height='100%' xmlns='http://www.w3.org/2000/svg'>";
    for (let i = 0; i < 70; i++) {
      const x = Math.random() * 100, y = Math.random() * 100, r = Math.random() * 1.1 + 0.2;
      const op = Math.random() * 0.6 + 0.1;
      const dur = (Math.random() * 4 + 3).toFixed(2);
      svg += `<circle cx="${x}%" cy="${y}%" r="${r}" fill="#d9cbb0" opacity="${op}">
        <animate attributeName="opacity" values="${op};${op * 0.15};${op}" dur="${dur}s" repeatCount="indefinite" />
      </circle>`;
    }
    svg += "</svg>";
    el.innerHTML = svg;
  })();

  function setSession(session) {
    try { localStorage.setItem("leadrecovery.session", JSON.stringify(session)); } catch {}
  }

  const params = new URLSearchParams(window.location.search);
  const token = params.get("token");

  const requestPanel = document.getElementById("request-panel");
  const resetPanel = document.getElementById("reset-panel");

  if (token) {
    requestPanel.style.display = "none";
    resetPanel.style.display = "block";
    document.getElementById("base-url-2").value = window.location.origin;

    const resetError = document.getElementById("reset-error");
    const resetOk = document.getElementById("reset-ok");
    document.getElementById("reset-btn").addEventListener("click", async () => {
      resetError.textContent = "";
      resetOk.textContent = "";
      const baseUrl = (document.getElementById("base-url-2").value.trim() || window.location.origin).replace(/\/$/, "");
      const newPassword = document.getElementById("new-password").value;
      const confirmPassword = document.getElementById("confirm-password").value;
      if (newPassword.length < 8) {
        resetError.textContent = "Password must be at least 8 characters.";
        return;
      }
      if (newPassword !== confirmPassword) {
        resetError.textContent = "Passwords don't match.";
        return;
      }
      try {
        const res = await fetch(baseUrl + "/auth/reset-password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token, newPassword }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || res.statusText);
        setSession({ baseUrl, apiKey: data.apiKey });
        resetOk.textContent = "Password set. Redirecting you to your dashboard...";
        setTimeout(() => { window.location.href = "index.html"; }, 1200);
      } catch (err) {
        resetError.textContent = "Could not reset password: " + err.message;
      }
    });
  } else {
    document.getElementById("base-url").value = window.location.origin;
    const requestError = document.getElementById("request-error");
    const requestOk = document.getElementById("request-ok");
    document.getElementById("request-btn").addEventListener("click", async () => {
      requestError.textContent = "";
      requestOk.textContent = "";
      const baseUrl = (document.getElementById("base-url").value.trim() || window.location.origin).replace(/\/$/, "");
      const email = document.getElementById("email").value.trim();
      if (!email) {
        requestError.textContent = "Email is required.";
        return;
      }
      try {
        const res = await fetch(baseUrl + "/auth/forgot-password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || res.statusText);
        requestOk.textContent = data.message || "If that email has an account, a reset link has been sent.";
      } catch (err) {
        requestError.textContent = "Something went wrong: " + err.message;
      }
    });
  }
})();
</script>

</body>
</html>
