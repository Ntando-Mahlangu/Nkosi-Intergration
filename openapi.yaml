openapi: 3.0.3
info:
  title: LeadRecovery API
  description: >
    Multi-tenant lead recovery and reactivation API. Every route except
    /health, /ready, and the provider webhooks requires
    `Authorization: Bearer <tenant api key>`; admin routes require
    `Authorization: Bearer <ADMIN_API_KEY>` instead. See README.md for the
    full narrative reference — this file is the machine-readable version of
    the same routes.
  version: "0.2.0"
servers:
  - url: http://localhost:3000
    description: Local demo server (npm run dev)
tags:
  - name: health
  - name: auth
  - name: tenant-self-service
  - name: team
  - name: admin
  - name: leads
  - name: chat
  - name: inquiries
  - name: webhooks

security: []

paths:
  /health:
    get:
      tags: [health]
      summary: Liveness check
      description: Always 200 as long as the process is up. Checks nothing external.
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }

  /ready:
    get:
      tags: [health]
      summary: Readiness check
      description: Checks Postgres connectivity (SELECT 1) when DATABASE_URL is set.
      security: []
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  database: { type: string, example: "ok" }
        "503":
          description: Database unreachable
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: false }
                  database: { type: string, example: "unreachable" }
                  error: { type: string }

  /terms-version:
    get:
      tags: [tenant-self-service]
      summary: The current Terms of Service/Privacy Policy version
      description: >
        Public, no auth required. Returns the exact version string a
        client must send back to POST /tenants/me/accept-terms — lets
        every client-facing page fetch it instead of hardcoding it.
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  version: { type: string, example: "2026-09-25" }

  /auth/login:
    post:
      tags: [auth]
      summary: SaaS-style sign-in
      description: >
        Resolves email+password to the tenant's real API key rather than
        minting a session of its own — every dashboard already knows how
        to store/send an API key. Returns the same generic 401 whether the
        email doesn't match a tenant, that tenant never set a password, or
        the password is wrong, so a caller can't enumerate which emails
        have an account.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                type: object
                properties:
                  apiKey: { type: string }
                  tenant: { $ref: "#/components/schemas/PublicTenant" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Suspended" }

  /auth/forgot-password:
    post:
      tags: [auth]
      summary: Request a password-reset email
      description: >
        Always the same generic response whether or not the email matches
        a tenant — see /auth/login's own note on why. Emails a link (via
        PLATFORM_SENDGRID_API_KEY, or logged to the console if unset) that
        POST /auth/reset-password's token is good for 24 hours.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string }
      responses:
        "200":
          description: Generic success — check your email
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  message: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }

  /auth/reset-password:
    post:
      tags: [auth]
      summary: Set a new password from a reset/setup token
      description: >
        The same endpoint sets a tenant's *first* password (the link a
        newly-set `email` gets at creation — see POST /admin/tenants) and a
        later password reset — mechanically identical either way. The
        token is single-use and expires after 24 hours.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token: { type: string }
                newPassword: { type: string, minLength: 8 }
      responses:
        "200":
          description: Password set
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  apiKey: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }

  /auth/request-code:
    post:
      tags: [auth]
      summary: "Phone-number sign-in, step 1: request a one-time code"
      description: >
        The primary sign-in path going forward — no password to set or
        forget. Always the same generic response whether or not the phone
        matches a tenant's loginPhone — see /auth/login's own note on why.
        Texts a 6-digit code (via PLATFORM_SMS_FROM_NUMBER, or logged to the
        console if unset) that POST /auth/verify-code's code is good for 10
        minutes. The code itself is never returned here, unlike the
        password-setup link POST /admin/tenants can return — this endpoint
        takes only a phone number, so echoing the code back would let
        anyone with a phone number log in as that tenant.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone: { type: string, description: "E.164, e.g. +15551234567." }
      responses:
        "200":
          description: Generic success — check your phone
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  message: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }

  /auth/verify-code:
    post:
      tags: [auth]
      summary: "Phone-number sign-in, step 2: verify the code"
      description: >
        Resolves phone+code to the tenant's real API key, same pattern as
        /auth/login. Locks out after 5 wrong attempts since the last
        requested code until a fresh one is requested (a 6-digit code has
        far less entropy than a password). The same generic 401 covers an
        unknown phone, an expired code, a locked-out attempt count, and a
        wrong code.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, code]
              properties:
                phone: { type: string }
                code: { type: string }
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                type: object
                properties:
                  apiKey: { type: string }
                  tenant: { $ref: "#/components/schemas/PublicTenant" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Suspended" }

  /tenants/me:
    get:
      tags: [tenant-self-service]
      summary: The authenticated tenant's public info
      security: [{ tenantAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicTenant" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Suspended" }
    patch:
      tags: [tenant-self-service]
      summary: Update the tenant's own operational config
      description: >
        Updates timezone/quietHours/devMode/channels/notifyWebhookUrl/
        templates/knowledgeBase/autoReplyEnabled. `status` cannot be changed
        here — a tenant can't un-suspend itself; use the admin API.
        Owner-only (see "Team accounts") — a "member"-role team account
        gets 403.
      security: [{ tenantAuth: [] }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TenantConfigBody" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicTenant" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: The tenant is suspended, or authenticated as a "member"-role team account (owner-only — see "Team accounts")
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /tenants/me/accept-terms:
    post:
      tags: [tenant-self-service]
      summary: Record the tenant's acceptance of the current Terms of Service/Privacy Policy
      description: >
        Required before anything actually sends on this tenant's behalf —
        the worker, every inbound webhook's auto-reply, and
        POST /workflow/run all refuse to send for a tenant that hasn't
        accepted (a brand-new tenant starts unaccepted; pre-existing
        tenants were grandfathered by migration 0013). Only the exact
        current version (GET /terms-version) is accepted, so a client
        can't accept a version this deployment doesn't currently offer.
      security: [{ tenantAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: { type: string, example: "2026-09-25" }
      responses:
        "200":
          description: The updated tenant
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicTenant" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /tenants/me/change-password:
    post:
      tags: [tenant-self-service]
      summary: Set or change the tenant's own password while already signed in
      description: >
        `currentPassword` is required only if the tenant already has a
        password — a tenant with none yet can set its first one with just
        `newPassword` (holding the API key already proves the same access
        a new password would grant).
      security: [{ tenantAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newPassword]
              properties:
                currentPassword: { type: string }
                newPassword: { type: string, minLength: 8 }
      responses:
        "200":
          description: Password updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: Missing/invalid Authorization header, or an incorrect currentPassword
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403": { $ref: "#/components/responses/OwnerRoleRequired" }

  /tenants/me/team:
    get:
      tags: [team]
      summary: List this tenant's team members
      description: Open to any authenticated actor (owner or member) — see "Team accounts".
      security: [{ tenantAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PublicTenantUser" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Suspended" }
    post:
      tags: [team]
      summary: Invite a new team member
      description: >
        Owner-only. Emails the invited address a "set your password" link
        (src/authEmail.ts — logged server-side instead when no platform
        SendGrid key is configured). `email` must not already be in use by
        this tenant's own login or by another team member (globally,
        across every tenant).
      security: [{ tenantAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
                role: { type: string, enum: [owner, member], default: member }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicTenantUser" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/OwnerRoleRequired" }
        "409": { description: "email already in use" }

  /tenants/me/team/{id}:
    patch:
      tags: [team]
      summary: Change a team member's role
      description: Owner-only.
      security: [{ tenantAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { type: string, enum: [owner, member] }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicTenantUser" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/OwnerRoleRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [team]
      summary: Remove a team member
      description: Owner-only.
      security: [{ tenantAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/OwnerRoleRequired" }
        "404": { $ref: "#/components/responses/NotFound" }

  /tenants/me/report:
    get:
      tags: [tenant-self-service]
      summary: Activity summary for reporting/billing
      description: >
        Lead status counts (a current pipeline-health snapshot, not
        date-filtered) plus message activity — outbound sends by kind,
        inbound replies by classification — within an optional
        [since, until] window.
      security: [{ tenantAuth: [] }]
      parameters:
        - name: since
          in: query
          description: ISO 8601 date-time; only messages at/after this bound activity is aggregated.
          schema: { type: string, format: date-time }
        - name: until
          in: query
          description: ISO 8601 date-time; only messages at/before this bound activity is aggregated.
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  range:
                    type: object
                    properties:
                      since: { type: string, nullable: true, format: date-time }
                      until: { type: string, nullable: true, format: date-time }
                  leads:
                    type: object
                    properties:
                      total: { type: integer }
                      byStatus: { type: object, additionalProperties: { type: integer } }
                  messages:
                    type: object
                    properties:
                      outboundSent: { type: integer }
                      outboundByKind: { type: object, additionalProperties: { type: integer } }
                      inboundReceived: { type: integer }
                      inboundByClassification: { type: object, additionalProperties: { type: integer } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Suspended" }

  /admin/tenants:
    get:
      tags: [admin]
      summary: List tenants
      security: [{ adminAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: OK
          headers:
            X-Total-Count: { schema: { type: integer } }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PublicTenant" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/AdminDisabled" }
    post:
      tags: [admin]
      summary: Create a tenant
      description: Returns the raw API key exactly once — it is never shown again.
      security: [{ adminAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: "#/components/schemas/TenantConfigBody" }
                - type: object
                  required: [name, timezone]
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/PublicTenant" }
                  - type: object
                    properties:
                      apiKey: { type: string, description: "Shown only in this response." }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /admin/tenants/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    patch:
      tags: [admin]
      summary: Admin update — any self-service field, plus status
      description: 'The only way to suspend/reactivate a tenant (`status`: `"active"` or `"suspended"`).'
      security: [{ adminAuth: [] }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TenantConfigBody" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicTenant" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [admin]
      summary: Permanently delete a tenant
      description: Cascades to the tenant's leads/messages in Postgres. No undo.
      security: [{ adminAuth: [] }]
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/tenants/{id}/rotate-key:
    post:
      tags: [admin]
      summary: Issue a new API key for a tenant
      description: The old key stops working immediately. Returns the new raw key exactly once.
      security: [{ adminAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Rotated
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/PublicTenant" }
                  - type: object
                    properties:
                      apiKey: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/tenants/{id}/connect-number:
    post:
      tags: [admin]
      summary: Connect a client's existing number (missedcall.io-style, see src/numberHosting.ts)
      description: >
        Hosts SMS on the phone number this client already gives out to
        customers, on the shared Twilio account (DEFAULT_TWILIO_ACCOUNT_SID/
        DEFAULT_TWILIO_AUTH_TOKEN) — the alternative to assigning a brand new
        number. Ownership is proven by an automated Twilio verification call
        to that number, not a code entered here; the order can then take from
        minutes to several business days to fully complete (carrier
        processing, and possibly an emailed Letter of Authorization to sign).
      security: [{ adminAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phoneNumber, contactEmail, address]
              properties:
                phoneNumber: { type: string, description: "E.164, e.g. +15551234567 — the client's own existing number." }
                contactEmail: { type: string }
                address:
                  type: object
                  required: [customerName, street, city, region, postalCode, isoCountry]
                  properties:
                    customerName: { type: string }
                    street: { type: string }
                    city: { type: string }
                    region: { type: string }
                    postalCode: { type: string }
                    isoCountry: { type: string, description: "Two-letter country code, e.g. US." }
      responses:
        "201":
          description: Order started
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicTenant" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { description: "Twilio rejected the request (e.g. shared account not configured, invalid address)" }

  /admin/tenants/{id}/connect-number/refresh:
    post:
      tags: [admin]
      summary: Re-check an in-progress connect-number order's status with Twilio
      description: >
        Once status reaches "completed", this automatically turns on the sms
        channel using the client's own number (via the same shared-account
        resolution POST /admin/tenants already applies) — no separate manual
        step needed.
      security: [{ adminAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Status refreshed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicTenant" }
        "400": { description: "This tenant has no number-hosting order in progress" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { description: "Twilio rejected the status-check request" }

  /admin/notifications/failed:
    get:
      tags: [admin]
      summary: Notifications that failed to reach a tenant's notifyWebhookUrl
      description: >
        "pending" ones are still being retried by the worker each tick;
        "dead" ones gave up after the max attempt count and need attention
        (usually a broken notifyWebhookUrl).
      security: [{ adminAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/FailedNotification" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /admin/audit-log:
    get:
      tags: [admin]
      summary: Admin action history, newest first
      security: [{ adminAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: OK
          headers:
            X-Total-Count: { schema: { type: integer } }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AuditLogEntry" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /admin/inquiries:
    get:
      tags: [inquiries]
      summary: List sales inquiries from the public marketing page, newest first
      security: [{ adminAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: OK
          headers:
            X-Total-Count: { schema: { type: integer } }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SalesInquiry" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /admin/inquiries/{id}:
    patch:
      tags: [inquiries]
      summary: Update a sales inquiry's status (new/contacted/closed)
      security: [{ adminAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [new, contacted, closed] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SalesInquiry" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: No such inquiry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /leads:
    get:
      tags: [leads]
      summary: List the tenant's leads
      security: [{ tenantAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - name: needsAttention
          in: query
          description: When "true", restricts the list to leads currently flagged in the needs-attention inbox (see POST /leads/{id}/reply and /leads/{id}/mark-handled).
          schema: { type: string, enum: ["true"] }
      responses:
        "200":
          description: OK
          headers:
            X-Total-Count: { schema: { type: integer } }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Lead" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Suspended" }

  /leads/plan:
    get:
      tags: [leads]
      summary: Dry run — scored + composed plans, nothing sent
      security: [{ tenantAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: OK
          headers:
            X-Total-Count: { schema: { type: integer } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkflowResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Suspended" }

  /leads/{id}/messages:
    get:
      tags: [leads]
      summary: Conversation history for one lead
      security: [{ tenantAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Message" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Suspended" }

  /leads/{id}:
    patch:
      tags: [leads]
      summary: Update one lead's editable fields
      description: >
        Never accepts `status` (compliance-sensitive; only ever set by the
        classify/workflow logic) — rejected with 400. Clearing
        `appointmentAt` also clears `appointmentReminderSentAt`, so
        rescheduling gets a fresh 24-hours-before reminder instead of being
        silently blocked by the old appointment's sent-flag.
      security: [{ tenantAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LeadPatchBody" }
      responses:
        "200":
          description: The updated lead
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lead" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Suspended" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [leads]
      summary: Permanently delete one lead (a right-to-erasure request)
      description: >
        Cascades to the lead's message history in Postgres. No undo.
        Distinct from the automatic data-retention purge (see
        COMPLIANCE.md), which never touches do_not_contact/opted_out leads
        — this endpoint deletes regardless of status, since it's an
        explicit request for one specific person's data.
      security: [{ tenantAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Suspended" }
        "404": { $ref: "#/components/responses/NotFound" }

  /leads/{id}/convert:
    post:
      tags: [leads]
      summary: Mark a lead as a converted/won customer
      description: >
        Sets `status: "converted"` and `convertedAt`. Optionally records this
        specific lead's own `marketingOptIn` for later win-back messaging —
        see COMPLIANCE.md "Win-back messaging for past customers". Converting
        a lead does not by itself opt it into anything; `marketingOptIn`
        must be explicitly true (here or via a later `PATCH /leads/{id}`).
      security: [{ tenantAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LeadConvertBody" }
      responses:
        "200":
          description: The updated lead
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lead" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Suspended" }
        "404": { $ref: "#/components/responses/NotFound" }

  /leads/{id}/reply:
    post:
      tags: [leads]
      summary: Send a real reply on an operator's behalf, resolving a needs-attention item
      description: >
        Sends through the lead's usual channel (selectChannel's own choice)
        unless `channel` overrides it. Logged as kind "manual_reply". Clears
        needsAttentionAt/needsAttentionReason/attentionAlertedAt on success.
        A "chat" reply is recorded but cannot be pushed live into an
        already-open chat-widget tab (no WebSocket/SSE infra) — it surfaces
        next time that visitor's widget polls.
      security: [{ tenantAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LeadReplyBody" }
      responses:
        "200":
          description: The updated lead
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lead" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Suspended" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { description: "No usable channel for this lead, or carrier approval is still required" }
        "502": { description: "The provider send itself failed" }

  /leads/{id}/mark-handled:
    post:
      tags: [leads]
      summary: Clear a needs-attention flag without sending anything
      description: >
        For when an operator resolved the lead some other way (a phone call,
        etc.) — just clears needsAttentionAt/needsAttentionReason/attentionAlertedAt.
      security: [{ tenantAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The updated lead
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lead" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Suspended" }
        "404": { $ref: "#/components/responses/NotFound" }

  /leads/import:
    post:
      tags: [leads]
      summary: Bulk-create leads from a CSV file
      description: >
        Same columns/validation as `npm run import-leads` (see
        README.md/ONBOARDING.md): name, phone, email, source, createdAt,
        requestedService, previousQuote, appointmentAt, notes — at least
        phone or email is required per row, and other rows are skipped
        (counted, not rejected). A row with a valid appointmentAt is
        automatically marked appointmentStatus "booked". Skips (rather than
        merging) a row whose phone/email already matches an existing lead
        for this tenant, or an earlier row in the same file — counted
        separately as `duplicates`.
      security: [{ tenantAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [csv]
              properties:
                csv: { type: string, description: "Raw CSV file contents, max 5MB." }
      responses:
        "201":
          description: Import result
          content:
            application/json:
              schema:
                type: object
                properties:
                  imported: { type: integer }
                  skipped: { type: integer, description: "Rows with neither phone nor email." }
                  duplicates: { type: integer, description: "Rows matching an existing lead, or an earlier row in this same file." }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Suspended" }

  /leads/export:
    get:
      tags: [leads]
      summary: Full-fidelity export of every lead field
      description: >
        A one-shot download (never paginated) — for a client's own records
        or a data right-of-access request. CSV by default; pass
        ?format=json for a plain JSON array instead.
      security: [{ tenantAuth: [] }]
      parameters:
        - name: format
          in: query
          schema: { type: string, enum: [csv, json], default: csv }
      responses:
        "200":
          description: OK
          content:
            text/csv:
              schema: { type: string }
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Lead" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Suspended" }

  /workflow/run:
    post:
      tags: [leads]
      summary: Send initial outreach + due follow-ups
      security: [{ tenantAuth: [] }]
      responses:
        "200":
          description: Run result
          content:
            application/json:
              schema:
                type: object
                properties:
                  sent: { type: array, items: { type: object } }
                  skipped: { type: array, items: { type: object } }
                  deferred: { type: array, items: { type: object } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Suspended" }

  /inquiries:
    post:
      tags: [inquiries]
      summary: Public "request a demo" form (public/get-started.html's marketing page)
      description: >
        Unauthenticated by design — submitted directly from the marketing
        page served by this same app. Distinct from
        /public/leads/{tenantId}: that endpoint creates a lead for an
        existing tenant; this one has no tenant at all — it's a
        prospective business inquiring about becoming a LeadRecovery
        client in the first place. Reviewed via GET/PATCH
        /admin/inquiries.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [businessName]
              properties:
                businessName: { type: string }
                contactName: { type: string }
                email: { type: string, description: "phone or email is required." }
                phone: { type: string }
                website: { type: string }
                message: { type: string }
      responses:
        "201":
          description: Inquiry recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
        "400": { $ref: "#/components/responses/BadRequest" }

  /public/leads/{tenantId}:
    post:
      tags: [leads]
      summary: Public lead-capture form (embedded on the tenant's own website)
      description: >
        Deliberately not behind tenantAuth — meant to be called directly
        from a tenant's own public website via front-end JS (see
        public/settings.html's embeddable snippet), where a real API key
        would let anyone who views source read/send on that tenant's
        behalf. `formKey` (Tenant.publicFormKey) is the opposite: it can
        only ever create a lead through this one endpoint. Any origin may
        call this (Access-Control-Allow-Origin: *) since the tenant's
        website domain isn't known in advance.
      security: []
      parameters:
        - name: tenantId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [formKey]
              properties:
                formKey: { type: string }
                name: { type: string }
                phone: { type: string, description: "phone or email is required." }
                email: { type: string }
                requestedService: { type: string }
                notes: { type: string }
      responses:
        "201":
          description: Lead created
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: Invalid tenantId or formKey (same generic response for either, to avoid tenant-id enumeration)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Tenant is suspended and not currently accepting new leads
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /public/chat/{tenantId}/start:
    post:
      tags: [chat]
      summary: Start a new website-chat-widget conversation
      description: >
        Public, no tenant-auth — the first call the embeddable widget
        (public/chat-widget.js) makes. Creates a real Lead (source "chat")
        and a second, per-conversation chatToken distinct from formKey — see
        README.md "Website chat widget". Any origin may call this, same as
        /public/leads/{tenantId}.
      security: []
      parameters:
        - name: tenantId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [formKey]
              properties:
                formKey: { type: string }
                name: { type: string }
                phone: { type: string }
                email: { type: string }
      responses:
        "201":
          description: Conversation started
          content:
            application/json:
              schema:
                type: object
                properties:
                  leadId: { type: string }
                  chatToken: { type: string, description: "Never stored raw server-side (only its hash) — keep this client-side only." }
        "401":
          description: Invalid tenantId or formKey
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Tenant is suspended
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /public/chat/{tenantId}/message:
    post:
      tags: [chat]
      summary: Send a message in an existing chat-widget conversation
      description: >
        Public — requires both formKey and the conversation's own
        chatToken (from /start). Runs the same classify → auto-reply/
        escalate pipeline as an inbound SMS/WhatsApp/email reply
        (src/chatWidget.ts), but returns the reply synchronously instead of
        sending through a channel adapter.
      security: []
      parameters:
        - name: tenantId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [formKey, leadId, chatToken, body]
              properties:
                formKey: { type: string }
                leadId: { type: string }
                chatToken: { type: string }
                body: { type: string, maxLength: 4000 }
      responses:
        "200":
          description: The bot's reply (or a fixed hand-off/stop notice)
          content:
            application/json:
              schema:
                type: object
                properties:
                  classification:
                    type: string
                    enum: [stop, interested, not_interested, question, unknown]
                  displayText:
                    type: string
                    description: Always populated — show this directly in the widget.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: Invalid formKey/leadId/chatToken combination
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Tenant is suspended
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: Tenant hasn't accepted LeadRecovery's own Terms of Service yet
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /public/chat/{tenantId}/history:
    get:
      tags: [chat]
      summary: This conversation's message history
      description: Lets the widget resume a conversation across page reloads. Scoped strictly to channel "chat" — never surfaces any other channel's history for the same lead.
      security: []
      parameters:
        - name: tenantId
          in: path
          required: true
          schema: { type: string }
        - name: formKey
          in: query
          required: true
          schema: { type: string }
        - name: leadId
          in: query
          required: true
          schema: { type: string }
        - name: chatToken
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: This conversation's messages, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    direction: { type: string, enum: [inbound, outbound] }
                    body: { type: string }
                    at: { type: string, format: date-time }
        "401":
          description: Invalid formKey/leadId/chatToken combination
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /webhooks/lead:
    post:
      tags: [webhooks]
      summary: Generic lead intake
      description: Connect an arbitrary CRM via its outgoing webhook, or a Zapier/Make/n8n automation.
      security: [{ tenantAuth: [] }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Lead" }
      responses:
        "201": { description: Created }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /webhooks/{tenantId}/twilio/sms:
    post:
      tags: [webhooks]
      summary: Twilio inbound SMS/WhatsApp reply
      description: Signature-verified via the Twilio request signature (PUBLIC_BASE_URL-aware).
      security: []
      parameters:
        - name: tenantId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema: { type: object }
      responses:
        "200": { description: Handled }
        "403": { description: Invalid Twilio signature }

  /webhooks/{tenantId}/twilio/voice-status:
    post:
      tags: [webhooks]
      summary: Twilio call status — missed-call detection
      description: Signature-verified.
      security: []
      parameters:
        - name: tenantId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema: { type: object }
      responses:
        "200": { description: Handled }
        "403": { description: Invalid Twilio signature }

  /webhooks/{tenantId}/twilio/status:
    post:
      tags: [webhooks]
      summary: Twilio delivery-status callback
      description: Signature-verified. URL is set automatically per-send when PUBLIC_BASE_URL is configured.
      security: []
      parameters:
        - name: tenantId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema: { type: object }
      responses:
        "200": { description: Handled }
        "403": { description: Invalid Twilio signature }

  /webhooks/{tenantId}/sendgrid/email:
    post:
      tags: [webhooks]
      summary: SendGrid inbound parse
      description: Guarded by a shared `?token=` secret (SendGrid has no signing option for Inbound Parse).
      security: []
      parameters:
        - name: tenantId
          in: path
          required: true
          schema: { type: string }
        - name: token
          in: query
          required: true
          schema: { type: string }
      requestBody:
        content:
          multipart/form-data:
            schema: { type: object }
      responses:
        "200": { description: Handled }
        "403": { description: Invalid token }

  /webhooks/{tenantId}/sendgrid/events:
    post:
      tags: [webhooks]
      summary: SendGrid Event Webhook — delivered/bounce/etc.
      description: >
        Verifies a real ECDSA signature when the tenant's
        channels.email.eventWebhookPublicKey is set; otherwise falls back to
        a shared `?token=` secret.
      security: []
      parameters:
        - name: tenantId
          in: path
          required: true
          schema: { type: string }
        - name: token
          in: query
          required: false
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema: { type: array, items: { type: object } }
      responses:
        "200": { description: Handled }
        "403": { description: Invalid signature/token }

  /webhooks/paddle:
    post:
      tags: [webhooks]
      summary: Paddle billing — auto-suspend/reactivate on subscription lapse/recovery
      description: >
        Not scoped to a tenant in the URL — Paddle is the agency's own
        billing account, shared across every tenant. Signature-verified via
        the `Paddle-Signature` header against PADDLE_WEBHOOK_SECRET; disabled
        (503) entirely when that env var is unset. See "Billing (Paddle)" in
        DEPLOYMENT.md.
      security: []
      requestBody:
        content:
          application/json:
            schema: { type: object }
      responses:
        "204": { description: Handled (including no-op event types and unmatched tenants) }
        "403": { description: Invalid signature }
        "503": { description: PADDLE_WEBHOOK_SECRET not configured }

components:
  securitySchemes:
    tenantAuth:
      type: http
      scheme: bearer
      description: A tenant's own API key.
    adminAuth:
      type: http
      scheme: bearer
      description: ADMIN_API_KEY.

  parameters:
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1 }
    Offset:
      name: offset
      in: query
      required: false
      schema: { type: integer, minimum: 0, default: 0 }

  responses:
    Unauthorized:
      description: Missing or invalid Authorization header
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Suspended:
      description: Tenant is suspended
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    OwnerRoleRequired:
      description: Authenticated as a team member with role "member" — only the tenant's own login or an "owner"-role team member can do this (see "Team accounts")
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: No such resource
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BadRequest:
      description: Invalid request body
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    AdminDisabled:
      description: ADMIN_API_KEY is not configured — the admin API is disabled entirely
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      properties:
        error: { type: string }

    QuietHours:
      type: object
      properties:
        startHour: { type: integer, minimum: 0, maximum: 23 }
        endHour: { type: integer, minimum: 0, maximum: 23 }

    MessageTemplates:
      type: object
      properties:
        initialGrounded: { type: string }
        initialUngrounded: { type: string }
        followUps: { type: array, items: { type: string } }
        notInterestedCloser: { type: string }
        appointmentReminder:
          type: string
          description: "Sent ~24 hours before a booked appointment. Supports {name}/{businessName}/{appointmentTime}."
        winBack:
          type: string
          description: "Periodic check-in to an opted-in past customer. Supports {name}/{businessName}/{serviceClause}."

    TenantConfigBody:
      type: object
      description: Fields accepted by PATCH /tenants/me, POST /admin/tenants, and PATCH /admin/tenants/:id (status only via the admin routes).
      properties:
        name: { type: string }
        timezone: { type: string, description: "IANA timezone, e.g. Africa/Johannesburg" }
        quietHours: { $ref: "#/components/schemas/QuietHours" }
        devMode: { type: boolean }
        channels:
          type: object
          description: Per-channel provider credentials — write-only, never returned by any GET.
        notifyWebhookUrl: { type: string, format: uri }
        templates: { $ref: "#/components/schemas/MessageTemplates" }
        knowledgeBase: { type: string, maxLength: 20000 }
        autoReplyEnabled: { type: boolean }
        status:
          type: string
          enum: [active, suspended]
          description: Admin-only — rejected with 400 on PATCH /tenants/me.
        paddleSubscriptionId:
          type: string
          nullable: true
          description: >-
            Admin-only — rejected with 400 on PATCH /tenants/me. Set null to
            clear it. Must be unique across tenants; usually self-filled by
            /webhooks/paddle rather than set by hand.
        contactPhone:
          type: string
          maxLength: 320
          description: Reference-only business contact phone, for the agency's own records — never used to send/receive messages.
        contactEmail:
          type: string
          maxLength: 320
          description: Reference-only business contact email, for the agency's own records — never used to send email.
        website:
          type: string
          maxLength: 320
          description: Reference-only business website, for the agency's own records.
        consentBasisConfirmed:
          type: boolean
          description: >-
            POST /admin/tenants only. Not enforced with a 400 (so the
            onboarding CLI/CI/direct integrations aren't hard-blocked), but
            recorded as consentBasisConfirmedAt when true — see
            COMPLIANCE.md "Consent basis".
        termsAttested:
          type: boolean
          description: >-
            POST /admin/tenants only. An onboarding attestation that the
            client already agreed to the Terms of Service/Privacy Policy
            outside the app — recorded as termsAttestedAt when true. Does
            NOT set termsAcceptedAt: the client's own required in-app
            acceptance (see /tenants/me/accept-terms) is untouched. See
            COMPLIANCE.md "Your own Terms of Service / Privacy Policy".
        carrierApprovalConfirmed:
          type: boolean
          description: >-
            Admin-only (rejected on PATCH /tenants/me, same as status).
            true records carrierApprovalConfirmedAt now; false clears it.
            Gates the sms/whatsapp channels — see COMPLIANCE.md
            "SMS / WhatsApp (Twilio)".
        botDisclosureEnabled:
          type: boolean
          description: Whether the chatbot's first auto-reply per conversation proactively discloses it's automated. Defaults to true when unset.
        dataRetentionDays:
          type: integer
          minimum: 30
          maximum: 3650
          description: How many days after a lead closes out before the worker auto-purges it. Defaults to 365 when unset.
        email:
          type: string
          nullable: true
          description: >-
            The tenant's SaaS-style login identity (see /auth/login) —
            distinct from contactEmail, which is reference-only. Set null
            (or an empty string) to remove email/password sign-in. Setting
            it on POST /admin/tenants emails a set-password link (see
            /auth/reset-password).
        loginPhone:
          type: string
          nullable: true
          description: >-
            The tenant's phone-based login identity (see /auth/request-code,
            /auth/verify-code) — the primary sign-in path going forward, no
            password involved. Distinct from contactPhone (reference-only)
            and from channels.sms.fromNumber (the number *leads* are texted
            from). E.164 format. Set null (or an empty string) to remove
            phone sign-in.
        winBackEnabled:
          type: boolean
          description: >-
            Opt-in: periodic win-back check-ins for converted leads who each
            individually have their own marketingOptIn set (see
            POST /leads/{id}/convert, PATCH /leads/{id}). Off by default —
            see COMPLIANCE.md "Win-back messaging for past customers".
        winBackCooldownDays:
          type: integer
          minimum: 30
          maximum: 3650
          description: Days between win-back check-ins for one lead. Defaults to 180 when unset.
        attentionSlaHours:
          type: integer
          minimum: 1
          maximum: 720
          nullable: true
          description: >-
            Opt-in: hours before a lead still unresolved in the
            needs-attention inbox (see Lead.needsAttentionAt) fires a
            one-time operator alert (src/operatorAlert.ts). Unset/null
            disables SLA alerting for this tenant.

    PublicTenant:
      type: object
      description: Tenant shape with all secrets stripped (no apiKey, no raw channel credentials).
      properties:
        id: { type: string }
        name: { type: string }
        timezone: { type: string }
        quietHours: { $ref: "#/components/schemas/QuietHours" }
        devMode: { type: boolean }
        channels:
          type: object
          properties:
            sms: { type: boolean }
            whatsapp: { type: boolean }
            email: { type: boolean }
        notifyWebhookUrl: { type: string }
        templates: { $ref: "#/components/schemas/MessageTemplates" }
        knowledgeBase: { type: string }
        autoReplyEnabled: { type: boolean }
        status: { type: string, enum: [active, suspended] }
        statusReason:
          type: string
          enum: [manual, billing]
          description: Why `status` last changed — an admin's own PATCH ("manual") vs. an automatic /webhooks/paddle change ("billing"). Informational only.
        paddleSubscriptionId: { type: string, description: "Paddle subscription id (sub_...) backing this tenant's billing, if any." }
        paddleLastEventAt: { type: string, description: "occurred_at of the most recent Paddle webhook event applied to this tenant's status, as Paddle sent it." }
        contactPhone: { type: string, description: "Reference-only business contact phone, if set at onboarding." }
        contactEmail: { type: string, description: "Reference-only business contact email, if set at onboarding." }
        website: { type: string, description: "Reference-only business website, if set at onboarding." }
        termsAcceptedAt: { type: string, format: date-time, description: "When this tenant accepted the Terms of Service/Privacy Policy. Unset blocks all outbound sending." }
        termsVersion: { type: string, description: "Which CURRENT_TERMS_VERSION was accepted, or \"grandfathered\" for a tenant that predates this field." }
        consentBasisConfirmedAt: { type: string, format: date-time, description: "When the agency confirmed this client has a lawful basis to contact its leads. An audit record, not enforced server-side." }
        termsAttestedAt: { type: string, format: date-time, description: "When the agency recorded that this client already agreed to the Terms of Service/Privacy Policy outside the app. An onboarding record only — does not substitute for termsAcceptedAt." }
        carrierApprovalConfirmedAt: { type: string, format: date-time, description: "When the agency confirmed 10DLC/WhatsApp carrier approval. Unset blocks the sms/whatsapp channels (falls back to email, or skips the lead)." }
        botDisclosureEnabled: { type: boolean, description: "Whether the chatbot's first auto-reply per conversation proactively discloses it's automated. Defaults to true when unset." }
        dataRetentionDays: { type: integer, description: "Days after a lead closes out before the worker auto-purges it. Defaults to 365 when unset." }
        email: { type: string, description: "The tenant's login identity for /auth/login, if set." }
        loginPhone: { type: string, description: "The tenant's phone-based login identity for /auth/request-code + /auth/verify-code, if set — the primary sign-in path going forward." }
        hasPassword: { type: boolean, description: "Whether this tenant has ever set a password — settings.html uses this to show \"Set password\" vs \"Change password\"." }
        publicFormKey: { type: string, description: "Low-privilege token for POST /public/leads/{tenantId} — safe to publish in the tenant's own website (see public/settings.html's embed snippet)." }
        numberHostingOrder: { $ref: "#/components/schemas/NumberHostingOrder" }
        winBackEnabled: { type: boolean, description: "Opt-in: periodic win-back check-ins for converted, opted-in leads. Off by default." }
        winBackCooldownDays: { type: integer, description: "Days between win-back check-ins for one lead. Defaults to 180 when unset." }
        attentionSlaHours: { type: integer, description: "Opt-in: hours before a stale needs-attention item fires a one-time operator alert. Unset disables it." }
        createdAt: { type: string, format: date-time }

    PublicTenantUser:
      type: object
      description: >
        A team member under a tenant (see "Team accounts") with all secrets
        stripped (no passwordHash, no loginKey, no reset-token hash).
      properties:
        id: { type: string }
        tenantId: { type: string }
        email: { type: string }
        role: { type: string, enum: [owner, member] }
        hasPassword: { type: boolean, description: "Whether this member has ever set a password yet (false right after being invited, before they use the emailed link)." }
        passwordResetExpiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }

    NumberHostingOrder:
      type: object
      description: >
        An in-progress or completed "connect this client's existing number"
        request (see src/numberHosting.ts) — the missedcall.io-style
        alternative to assigning a brand new number.
      properties:
        orderSid: { type: string }
        phoneNumber: { type: string }
        status:
          type: string
          description: Mirrors Twilio's own HostedNumberOrder status values verbatim.
          enum: [received, pending-verification, verified, pending-loa, carrier-processing, testing, completed, action-required, failed]
        nextStep: { type: string, description: "Twilio's own description of what happens next." }
        failureReason: { type: string, description: 'Only set once status is "action-required" or "failed".' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    Lead:
      type: object
      properties:
        id: { type: string }
        tenantId: { type: string }
        name: { type: string }
        phone: { type: string }
        email: { type: string }
        source:
          type: string
          enum: [crm, website_form, missed_call, booking_software, email, sms, whatsapp, chat, spreadsheet, customer_database, other]
        createdAt: { type: string, format: date-time }
        status:
          type: string
          enum:
            [
              new,
              contacted_no_response,
              responded,
              booked,
              converted,
              do_not_contact,
              unqualified,
              fraudulent,
              active_conversation,
              opted_out,
            ]
        requestedService: { type: string }
        previousQuote: { type: string }
        appointmentStatus:
          type: string
          enum: [none, requested, abandoned, booked]
        appointmentAt:
          type: string
          format: date-time
          description: "When the booked appointment is scheduled for. Only meaningful when appointmentStatus is \"booked\"; drives the 24-hours-before reminder."
        appointmentReminderSentAt:
          type: string
          format: date-time
          description: "When the appointment reminder was actually sent — set automatically, guards against sending it twice."
        preferredChannel:
          type: string
          enum: [sms, whatsapp, email]
        notes: { type: string }
        convertedAt:
          type: string
          format: date-time
          description: When this lead's status was set to "converted" — see POST /leads/{id}/convert.
        marketingOptIn:
          type: boolean
          description: This specific lead's own opt-in to win-back messaging after converting — see COMPLIANCE.md "Win-back messaging for past customers".
        lastWinBackAt:
          type: string
          format: date-time
          description: When the last win-back check-in was actually sent.
        chatTokenHash:
          type: string
          description: Hash only (never the raw token) of this lead's chat-widget session token, if it was created that way. See POST /public/chat/{tenantId}/start.
        needsAttentionAt:
          type: string
          format: date-time
          description: Set when this lead needs a human's attention (an "interested" reply, or the auto-reply chatbot escalating) — drives the dashboard's needs-attention inbox. Never overwritten by a later inbound message while already set, so it reflects true wait time. Cleared by POST /leads/{id}/reply or /leads/{id}/mark-handled.
        needsAttentionReason:
          type: string
          enum: [interested, needs_human_reply]
          description: Why needsAttentionAt is set.
        attentionAlertedAt:
          type: string
          format: date-time
          description: Set once an SLA operator-alert has fired for this specific unresolved needsAttentionAt, so it only fires once. Cleared along with needsAttentionAt.

    LeadPatchBody:
      type: object
      description: Fields accepted by PATCH /leads/{id}. Never accepts status.
      properties:
        name: { type: string }
        requestedService: { type: string }
        previousQuote: { type: string }
        notes: { type: string }
        preferredChannel:
          type: string
          enum: [sms, whatsapp, email]
        appointmentStatus:
          type: string
          enum: [none, requested, abandoned, booked]
        appointmentAt:
          type: string
          format: date-time
          nullable: true
          description: Set null to clear it (also clears appointmentReminderSentAt).
        marketingOptIn:
          type: boolean
          description: This lead's own opt-in to later win-back messaging.

    LeadConvertBody:
      type: object
      description: Body for POST /leads/{id}/convert.
      properties:
        marketingOptIn:
          type: boolean
          description: Whether this lead personally agreed to occasional win-back messages after becoming a customer. Omitted/false means not opted in.

    LeadReplyBody:
      type: object
      description: Body for POST /leads/{id}/reply.
      required: [message]
      properties:
        message: { type: string, description: The reply text to send. }
        channel:
          type: string
          enum: [sms, whatsapp, email, chat]
          description: Overrides the automatically-selected channel (selectChannel's own choice, same as an automated send).

    Message:
      type: object
      properties:
        id: { type: string }
        tenantId: { type: string }
        leadId: { type: string }
        channel: { type: string, enum: [sms, whatsapp, email] }
        direction: { type: string, enum: [outbound, inbound] }
        body: { type: string }
        at: { type: string, format: date-time }
        classification: { type: string, enum: [stop, interested, not_interested, question, unknown] }
        deliveryStatus: { type: string }
        kind: { type: string, enum: [campaign, auto_reply, closer, appointment_reminder, win_back, manual_reply] }

    RecoveryPlan:
      type: object
      properties:
        lead: { $ref: "#/components/schemas/Lead" }
        priority: { type: string, enum: [HIGH, MEDIUM, LOW] }
        priorityReasons: { type: array, items: { type: string } }
        reason:
          type: object
          properties:
            text: { type: string }
            grounded: { type: boolean }
        message:
          type: object
          properties:
            channel: { type: string, enum: [sms, whatsapp, email] }
            body: { type: string }

    WorkflowResult:
      type: object
      properties:
        plans: { type: array, items: { $ref: "#/components/schemas/RecoveryPlan" } }
        skipped:
          type: array
          items:
            type: object
            properties:
              lead: { $ref: "#/components/schemas/Lead" }
              reason: { type: string }

    FailedNotification:
      type: object
      properties:
        id: { type: string }
        tenantId: { type: string }
        leadId: { type: string }
        reason: { type: string, enum: [interested, needs_human_reply] }
        webhookUrl: { type: string }
        payload: { type: object }
        attempts: { type: integer }
        lastError: { type: string }
        status: { type: string, enum: [pending, dead] }
        createdAt: { type: string, format: date-time }
        lastAttemptAt: { type: string, format: date-time }

    AuditLogEntry:
      type: object
      properties:
        id: { type: string }
        tenantId: { type: string }
        action:
          type: string
          enum: [tenant.create, tenant.admin_update, tenant.delete, tenant.key_rotate]
        actor: { type: string, example: admin }
        details: { type: object }
        createdAt: { type: string, format: date-time }

    SalesInquiry:
      type: object
      properties:
        id: { type: string }
        businessName: { type: string }
        contactName: { type: string }
        email: { type: string }
        phone: { type: string }
        website: { type: string }
        message: { type: string }
        status: { type: string, enum: [new, contacted, closed] }
        createdAt: { type: string, format: date-time }
