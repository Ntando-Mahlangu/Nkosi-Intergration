# Local/self-hosted stack: Postgres + the API server + the worker, all built
# from the same image (see Dockerfile). Copy .env.example to .env first.
#
# Usage:
#   docker compose up -d postgres
#   docker compose run --rm migrate
#   docker compose up -d app worker
#
# See DEPLOYMENT.md for the full walkthrough, required env vars, and the
# hard "exactly one worker replica" constraint.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: leadrecovery
      POSTGRES_PASSWORD: leadrecovery
      POSTGRES_DB: leadrecovery
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leadrecovery"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-off: `docker compose run --rm migrate` to apply src/db/migrations/*.sql.
  # Not part of `docker compose up` — re-running it is safe (each migration
  # is idempotent, e.g. `CREATE TABLE IF NOT EXISTS`) but it isn't a long-
  # running service.
  migrate:
    build: .
    command: ["node", "dist/scripts/migrate.js"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://leadrecovery:leadrecovery@postgres:5432/leadrecovery
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build: .
    restart: unless-stopped
    command: ["node", "dist/server.js"]
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://leadrecovery:leadrecovery@postgres:5432/leadrecovery
      PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy

  # Exactly one replica — do not `docker compose up --scale worker=2`. See
  # DEPLOYMENT.md and the comment in src/worker.ts.
  worker:
    build: .
    restart: unless-stopped
    command: ["node", "dist/worker.js"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://leadrecovery:leadrecovery@postgres:5432/leadrecovery
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
