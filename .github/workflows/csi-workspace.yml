name: CSI Workspace

on:
  push:
    paths: ["csi-workspace/**", ".github/workflows/csi-workspace.yml"]
  pull_request:
    paths: ["csi-workspace/**", ".github/workflows/csi-workspace.yml"]

defaults:
  run:
    working-directory: csi-workspace

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: csi-workspace/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm audit --omit=dev --audit-level=high
